# Repository-wide tooling. Python packages live in their own folders (app/, mcp/).
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S105/S106: names of environment variables that hold secrets are not secrets.
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
addopts = "-q"
