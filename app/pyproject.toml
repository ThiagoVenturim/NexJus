[project]
name= "Acompanhamento-de-NP"
version="0.1.0"
description= "Consulta de processo no Denatran"
readme="README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "requests>=2.31.0",
    "pydantic-settings>=2.2.0",
    "schedule>=1.2.0",
    "alembic>=1.13.0"
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]