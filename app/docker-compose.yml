services:
  db:
    image: postgres:15-alpine
    container_name: db_acompanhamento_np
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432" # Mapeia a porta do .env para a porta 5432 padrão do Postgres interno
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: app_acompanhamento_np
    restart: always
    ports:
      - "${FASTAPI_PORT}:8000" # Mapeia a porta do .env (8000) para a porta 8000 que o uvicorn expõe
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db

volumes:
  postgres_data:
