[project]
name = "nexjus-mcp"
version = "0.1.0"
description = "Servidor MCP local do NexJus: prazos CPC/CTB, processos e DataJud para clientes MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
nexjus-mcp = "nexjus_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexjus_mcp"]
