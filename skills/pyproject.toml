[project]
name = "nexjus-skills"
version = "0.1.0"
description = "Skills e agentes do Claude para advogados, integrados ao servidor MCP do NexJus"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
nexjus-skills = "nexjus_skills.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexjus_skills"]
